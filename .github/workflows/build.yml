name: Build and Release SummerCoop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summercoop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

jobs:
  core-tests:
    name: Protocol, network and update tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile core and run all tests without the game
        run: ./tools/build.ps1 -TestsOnly
      - name: Test the actual MWCoop transport and codec without game binaries
        run: ./tools/test-mwcoop-network.ps1
      - name: Test installation transactions used by the launcher
        run: ./tools/test-installer.ps1
      - name: Test launcher arguments, settings and Windows interface
        run: ./tools/test-launcher.ps1
      - name: Test release selection, checksums and native EXE replacement
        run: ./tools/test-native-updates.ps1
      - name: Test automatic Steam launcher registration and legacy copies
        run: ./tools/test-steam-binding.ps1 -LauncherPath SummerCoop-Launcher/SummerCoop-Launcher.exe
      - name: Test native save selection and new lobby worlds
        run: ./tools/test-native-saves.ps1 -LauncherPath SummerCoop-Launcher/SummerCoop-Launcher.exe
      - name: Test changelog generation and localized launcher notes
        run: ./tools/test-release-notes.ps1 -LauncherPath SummerCoop-Launcher/SummerCoop-Launcher.exe
      - name: Add test reports to the workflow summary
        if: always()
        run: |
          $fence = [string]([char]96) * 3
          foreach ($report in @('build/test-results.txt','build/mwcoop-network-tests/test-results.txt','build/installer-tests/test-results.txt','build/launcher-tests/test-results.txt','build/native-update-tests/test-results.txt','build/native-save-tests/test-results.txt','build/steam-binding-tests/test-results.txt','build/release-notes-tests/test-results.txt')) {
            if (Test-Path -LiteralPath $report) {
              @($report, '', ($fence + 'text')) + @(Get-Content -LiteralPath $report) + @($fence, '') |
                Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
            }
          }

  publish-release:
    name: Compile full mod, package and publish
    needs: [core-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Allocate a unique launcher version for this push
        id: version
        run: ./tools/release-version.ps1
      - name: Decrypt private game compilation references
        env:
          SUMMERCOOP_REFS_PASSPHRASE: ${{ secrets.SUMMERCOOP_REFS_PASSPHRASE }}
        run: ./tools/ci-references.ps1 -Mode Unpack
      - name: Compile both mod DLLs and the standalone launcher from this commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./tools/package.ps1 -RebuildMod -GamePath build/ci-game -Version $env:RELEASE_VERSION
      - name: Test the compiled MSC adapter
        run: ./tools/test-msc-adapter.ps1 -GamePath build/ci-game
      - name: Verify the actual release launcher
        run: ./tools/test-native-updates.ps1 -LauncherPath SummerCoop-Launcher/SummerCoop-Launcher.exe
      - name: Verify Steam registration with the actual release launcher
        run: ./tools/test-steam-binding.ps1 -LauncherPath SummerCoop-Launcher/SummerCoop-Launcher.exe
      - name: Verify saves with the actual release launcher
        run: ./tools/test-native-saves.ps1 -LauncherPath SummerCoop-Launcher/SummerCoop-Launcher.exe
      - name: Verify changelogs with the actual release launcher
        run: ./tools/test-release-notes.ps1 -LauncherPath SummerCoop-Launcher/SummerCoop-Launcher.exe
      - name: Upload all assets to a draft, verify and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./tools/publish-release.ps1 -Version $env:RELEASE_VERSION
      - name: Remove decrypted build references
        if: always()
        run: |
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'build'))
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE) + [IO.Path]::DirectorySeparatorChar
          if (!$target.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected cleanup path.' }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
